services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: administrasi-guru-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4010}:80"
    volumes:
      - ./.env:/var/www/html/.env
      - app_storage:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - administrasi_net

  db:
    image: mariadb:10.11
    container_name: administrasi-guru-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-db_administrasi_guru}
      MARIADB_USER: ${DB_USERNAME:-adminguru}
      MARIADB_PASSWORD: ${DB_PASSWORD:-GantiPasswordGuru2026!}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-GantiPasswordRoot2026!}
      TZ: Asia/Jakarta
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - administrasi_net

volumes:
  app_storage:
  db_data:

networks:
  administrasi_net:
    driver: bridge
